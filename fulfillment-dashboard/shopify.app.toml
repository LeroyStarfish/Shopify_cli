name = "Fulfillment Dashboard"
client_id = "YOUR_CLIENT_ID"
application_url = "https://YOUR_APP_URL.vercel.app"
embedded = true

[build]
include_config_on_deploy = true

[access_scopes]
# read_orders + read_fulfillments for the dashboard.
# write_fulfillments needed to post FulfillmentEvents back from Shippo webhooks.
scopes = "read_orders,read_fulfillments,read_shipping,write_fulfillments"

[auth]
redirect_urls = [
  "https://YOUR_APP_URL.vercel.app/auth/callback",
  "https://YOUR_APP_URL.vercel.app/auth/shopify/callback",
  "https://admin.shopify.com/oauth/redirect_from_cli"
]

[webhooks]
api_version = "2024-10"

  # Shopify fires this every time a fulfillment is created (including when
  # Shippo purchases a label and marks the order fulfilled).  We use it to
  # store the tracking-number → Shopify-fulfillment-GID mapping in the DB
  # so the Shippo webhook handler can look it up without a round-trip query.
  [[webhooks.subscriptions]]
  topics = ["fulfillments/create"]
  uri = "/webhooks/fulfillments"

[pos]
embedded = false
